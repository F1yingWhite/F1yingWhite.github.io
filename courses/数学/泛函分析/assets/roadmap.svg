<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">泛函分析的六个台阶</title><desc id="desc">六个方框展示从距离、空间和投影到对偶、算子和应用的学习路径。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">泛函分析的六个台阶</text><rect x="55" y="95" width="220" height="100" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="165" y="132" font-size="21" fill="#2563eb" text-anchor="middle">距离与范数</text><text x="165" y="167" font-size="17" fill="#475569" text-anchor="middle">选一把尺子</text><rect x="340" y="95" width="220" height="100" rx="14" fill="white" stroke="#07948a" stroke-width="2"/><text x="450" y="132" font-size="21" fill="#07948a" text-anchor="middle">完备与空间</text><text x="450" y="167" font-size="17" fill="#475569" text-anchor="middle">让近似有终点</text><rect x="625" y="95" width="220" height="100" rx="14" fill="white" stroke="#8b5cf6" stroke-width="2"/><text x="735" y="132" font-size="21" fill="#8b5cf6" text-anchor="middle">Hilbert 投影</text><text x="735" y="167" font-size="17" fill="#475569" text-anchor="middle">找最好的影子</text><rect x="55" y="265" width="220" height="100" rx="14" fill="white" stroke="#8b5cf6" stroke-width="2"/><text x="165" y="302" font-size="21" fill="#8b5cf6" text-anchor="middle">对偶与弱收敛</text><text x="165" y="337" font-size="17" fill="#475569" text-anchor="middle">用读数寻找极限</text><rect x="340" y="265" width="220" height="100" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="302" font-size="21" fill="#2563eb" text-anchor="middle">算子与谱</text><text x="450" y="337" font-size="17" fill="#475569" text-anchor="middle">研究稳定与方向</text><rect x="625" y="265" width="220" height="100" rx="14" fill="white" stroke="#07948a" stroke-width="2"/><text x="735" y="302" font-size="21" fill="#07948a" text-anchor="middle">变分与概率</text><text x="73