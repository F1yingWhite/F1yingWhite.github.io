<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">紧算子的谱：无穷多个点向零聚集</title><desc id="desc">实轴上标记一除以正整数，逐渐靠近零，零点以不同颜色标识。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">紧算子的谱：无穷多个点向零聚集</text><line x1="95" y1="225" x2="815" y2="225" stroke="#64748b" stroke-width="2"/><text x="95" y="90" font-size="22" fill="#26364d" text-anchor="start">Kx = (xₙ/n)，λₙ = 1/n</text><circle cx="760.0" cy="225" r="5" fill="#2563eb"/><text x="760.0" y="265" font-size="16" fill="#26364d" text-anchor="middle">1</text><circle cx="435.0" cy="225" r="5" fill="#2563eb"/><text x="435.0" y="265" font-size="16" fill="#26364d" text-anchor="middle">1/2</text><circle cx="326.66666666666663" cy="225" r="5" fill="#2563eb"/><text x="326.66666666666663" y="265" font-size="16" fill="#26364d" text-anchor="middle">1/3</text><circle cx="272.5" cy="225" r="5" fill="#2563eb"/><text x="272.5" y="265" font-size="16" fill="#26364d" text-anchor="middle">1/4</text><circle cx="240.0" cy="225" r="5" fill="#2563eb"/><circle cx="218.33333333333331" cy="225" r="5" fill="#2563eb"/><circle cx="202.85714285714286" cy="225" r="5" fill="#2563eb"/><circle cx="191.25" cy="225" r="5" fill="#2563eb"/><text x="191.25" y="265" font-size="16" fill="#26364d" text-anchor="middle">1/8</text><circle cx="182.22222222222223" cy="225" r="3" fill="#2563eb"/><circle cx="175.0" cy="225" r="3" fill="#2563eb"/><circle cx="169.0909090909091" cy="225" r="3" fill="#2563eb"/><circle cx="164.16666666666666" cy="225" r="3" fill="#2563eb"/><circle cx="160.0" cy="225" r="3" fill="#2563eb"/><circle cx="156.42857142857144" cy="225" r="3" fill="#2563eb"/><circle cx="153.33333333333334" cy="225" r="3" fill="#2563eb"/><circle cx="150.625" cy="225" r="3" fill="#2563eb"/><circle cx="148.23529411764707" cy="225" r="