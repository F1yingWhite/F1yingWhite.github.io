<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">信息有限时，怎样预测四种通勤时间</title><desc id="desc">四种等概率情况按 A B 两条线路分组，每组使用同一个均值预测。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">信息有限时，怎样预测四种通勤时间</text><rect x="65" y="95" width="180" height="220" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="155" y="130" font-size="20" fill="#2563eb" text-anchor="middle">线路 A</text><text x="155" y="180" font-size="22" fill="#26364d" text-anchor="middle">实际：1</text><text x="155" y="230" font-size="22" fill="#2563eb" text-anchor="middle">预测：2</text><text x="155" y="280" font-size="18" fill="#26364d" text-anchor="middle">误差：-1</text><rect x="275" y="95" width="180" height="220" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="365" y="130" font-size="20" fill="#2563eb" text-anchor="middle">线路 A</text><text x="365" y="180" font-size="22" fill="#26364d" text-anchor="middle">实际：3</text><text x="365" y="230" font-size="22" fill="#2563eb" text-anchor="middle">预测：2</text><text x="365" y="280" font-size="18" fill="#26364d" text-anchor="middle">误差：1</text><rect x="485" y="95" width="180" height="220" rx="12" fill="white" stroke="#07948a" stroke-width="2"/><text x="575" y="130" font-size="20" fill="#07948a" text-anchor="middle">线路 B</text><text x="575" y="180" font-size="22" fill="#26364d" text-anchor="middle">实际：2</text><text x="575" y="230" font-size="22" fill="#07948a" text-anchor="middle">预测：4</text><text x="575" y="280" font-size="18" fill="#26364d" text-anchor="middle">误差：-2</text><rect x="695" y="95" width="180" height="220" rx="12" fill="white" stroke="#07948a" stroke-width="2"/><text x="785" y="130" font-size="20" fill="#07948a" text-anchor="middle">线路 B</text><text x="785" y="180" font-size="22" fill="#26364d" text-anchor="middle">实际：6</text><text x="785" y="230" font-size="22" fill="#07948a" text-anchor="middle">预测：4</text><text x="785" y="280" font-size="18" fill="#26364d" text-anchor="middle">误差：2</text><text x="65" y="365" font-size="17" fill="#26364d" text-anchor="start">同一路线只能报同一个预测值；分别取组内均值，使平方误差最小。</text><text x="65" y="405" font-size="18" fill="#26364d" text-anchor="start">当前信息分不清的组内波动，仍留在误差里。</text></g></svg>
