<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">正交投影：最近点为什么是垂足</title><desc id="desc">原向量、投影与误差构成直角三角形。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">正交投影：最近点为什么是垂足</text><line x1="80" y1="305" x2="760" y2="305" stroke="#64748b" stroke-width="3"/><line x1="170" y1="305" x2="570" y2="100" stroke="#2563eb" stroke-width="4"/><line x1="170" y1="305" x2="570" y2="305" stroke="#07948a" stroke-width="5"/><line x1="570" y1="100" x2="570" y2="305" stroke="#e05b33" stroke-width="3" stroke-dasharray="7 6"/><path d="M552.00,305.00 L552.00,287.00 L570.00,287.00" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/><circle cx="570" cy="100" r="6" fill="#2563eb"/><circle cx="570" cy="305" r="6" fill="#07948a"/><circle cx="170" cy="305" r="5" fill="#26364d"/><text x="590" y="100" font-size="19" fill="#2563eb" text-anchor="start">x：原向量</text><text x="600" y="225" font-size="18" fill="#e05b33" text-anchor="start">误差 x − Pₘx</text><text x="420" y="338" font-size="18" fill="#07948a" text-anchor="start">Pₘx：最近的影子</text><text x="750" y="337" font-size="18" fill="#26364d" text-anchor="start">子空间 M</text><text x="80" y="395" font-size="18" fill="#26364d" text-anchor="start">误差垂直于 M；沿 M 挪动，只会增加另一条直角边。</text></g></svg>
