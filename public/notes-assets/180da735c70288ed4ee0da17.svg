<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">一条越来越窄的尖峰：到底算大还是小？</title><desc id="desc">三幅矩形尖峰高度均为一，宽度分别为一、三分之一和十分之一。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">一条越来越窄的尖峰：到底算大还是小？</text><line x1="100" y1="300" x2="250" y2="300" stroke="#94a3b8" stroke-width="1"/><line x1="100" y1="300" x2="100" y2="125" stroke="#94a3b8" stroke-width="1"/><text x="257" y="306" font-size="15" fill="#26364d" text-anchor="start">t</text><text x="94" y="115" font-size="15" fill="#26364d" text-anchor="start"></text><text x="92" y="320" font-size="13" fill="#26364d" text-anchor="start">0</text><rect x="100" y="140" width="135" height="160" fill="#2563eb" opacity="0.35" stroke="#2563eb" stroke-width="2"/><text x="100" y="100" font-size="18" fill="#2563eb" text-anchor="start">n = 1</text><text x="235" y="325" font-size="13" fill="#26364d" text-anchor="start">1</text><text x="78" y="147" font-size="13" fill="#26364d" text-anchor="start">1</text><line x1="410" y1="300" x2="560" y2="300" stroke="#94a3b8" stroke-width="1"/><line x1="410" y1="300" x2="410" y2="125" stroke="#94a3b8" stroke-width="1"/><text x="567" y="306" font-size="15" fill="#26364d" text-anchor="start">t</text><text x="404" y="115" font-size="15" fill="#26364d" text-anchor="start"></text><text x="402" y="320" font-size="13" fill="#26364d" text-anchor="start">0</text><rect x="410" y="140" width="45" height="160" fill="#e05b33" opacity="0.35" stroke="#e05b33" stroke-width="2"/><text x="410" y="100" font-size="18" fill="#e05b33" text-anchor="start">n = 3</text><text x="545" y="325" font-size="13" fill="#26364d" text-anchor="start">1</text><text x="388" y="147" font-size="13" fill="#26364d" text-anchor="start">1</text><line x1="700" y1="300" x2="850" y2="300" stroke="#94a3b8" stroke-width="1"/><line x1="700" y1="300" x2="700" y2="125" stroke="#94a3b8" stroke-width="1"/><text x="857" y="306" font-size="15" fill="#26364d" text-anchor="start">t</text><text x="694" y="115" font-size="15" fill="#26364d" text-anchor="start"></text><text x="692" y="320" font-size="13" fill="#26364d" text-anchor="start">0</text><rect x="700" y="140" width="13.5" height="160" fill="#07948a" opacity="0.35" stroke="#07948a" stroke-width="2"/><text x="700" y="100" font-size="18" fill="#07948a" text-anchor="start">n = 10</text><text x="835" y="325" font-size="13" fill="#26364d" text-anchor="start">1</text><text x="678" y="147" font-size="13" fill="#26364d" text-anchor="start">1</text><text x="70" y="370" font-size="18" fill="#26364d" text-anchor="start">fₙ = 1₍₀,₁/ₙ₎：高度为 1，面积为 1/n，平方积分也为 1/n。</text><text x="70" y="405" font-size="18" fill="#26364d" text-anchor="start">最大误差看高度；L¹ 看面积；L² 看平方积分的平方根。</text></g></svg>
