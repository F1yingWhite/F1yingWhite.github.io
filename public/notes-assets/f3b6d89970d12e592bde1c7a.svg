<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">乘积法则：两条长条与一个小角落</title><desc id="desc">矩形两边增长后，新增面积分成两条长条和一个二阶小角块。</desc><rect width="900" height="430" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text x="32" y="40" font-size="23" fill="#26364d" text-anchor="start">乘积法则：两条长条与一个小角落</text><rect x="95" y="135" width="280" height="145" fill="#dbe5f2"/><rect x="375" y="135" width="90" height="145" fill="#a8c8ff"/><rect x="95" y="65" width="280" height="70" fill="#a2ddd3"/><rect x="375" y="65" width="90" height="70" fill="#ffc4a9"/><text x="235.0" y="207.5" font-size="21" fill="#26364d" text-anchor="middle">原面积 uv</text><text x="420.0" y="207.5" font-size="20" fill="#26364d" text-anchor="middle">vΔu</text><text x="235.0" y="108.0" font-size="20" fill="#26364d" text-anchor="middle">uΔv</text><text x="420.0" y="108.0" font-size="17" fill="#26364d" text-anchor="middle">ΔuΔv</text><text x="545" y="125" font-size="20" fill="#2563eb" text-anchor="start">两条长条：一阶增加量</text><text x="545" y="180" font-size="19" fill="#e05b33" text-anchor="start">角落小块：两个小量相乘</text><text x="95" y="340" font-size="18" fill="#26364d" text-anchor="start">当 Δu、Δv 都与 h 同阶，角落面积为 h² 量级。</text><text x="95" y="380" font-size="18" fill="#26364d" text-anchor="start">除以 h 再取极限，留下 v u′ + u v′。</text></g></svg>
